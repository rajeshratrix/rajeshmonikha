<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rajesh & Monikha</title>
<meta name="description" content="A portrait-style invitation with full-screen images." />
<style>
  :root {
    color-scheme: dark;
    color: #fff;
    background: #050505;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body.opened { overflow-y: auto; }
  body { font-family: system-ui, sans-serif; background: #050505; }

  .envelope {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 45%), #050505;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  .envelope.closed { opacity: 0; visibility: hidden; pointer-events: none; }

  .envelope-shell {
    width: min(420px, 88vw);
    aspect-ratio: 9 / 11;
    position: relative;
    border-radius: 32px;
    background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 32px 90px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  .envelope-shell::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 35% 20%, rgba(255,255,255,0.24), transparent 28%), linear-gradient(180deg, rgba(255,255,255,0.08), transparent 20%);
    pointer-events: none;
  }

  .envelope-shell::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 58%;
    background: linear-gradient(135deg, rgba(255,255,255,0.17), rgba(255,255,255,0.03));
    clip-path: polygon(0 0, 100% 0, 50% 72%);
    transform-origin: top center;
    transition: transform 0.8s ease;
    z-index: 1;
  }

  .envelope.opened .envelope-shell::after {
    transform: translateY(-100%) rotateX(12deg);
  }

  .envelope-inner {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 2rem;
    text-align: center;
    z-index: 2;
  }
  .envelope-inner h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 4rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .envelope-inner button {
    margin-top: 2.5rem;
    padding: 1rem 2rem;
    border: 1px solid rgba(255,255,255,0.24);
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 0.95rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.25s ease, background 0.25s ease;
  }
  .envelope-inner button:hover { transform: translateY(-2px); background: rgba(255,255,255,0.14); }

  .envelope-hint {
    margin-top: 1rem;
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }

  .gallery {
    width: 100vw;
    min-height: 100vh;
    display: grid;
    scroll-snap-type: y mandatory;
    overflow-x: hidden;
    overflow-y: auto;
  }
  .slide {
    position: relative;
    min-height: 100vh;
    width: 100%;
    scroll-snap-align: start;
    background-size: contain;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: #050505;
  }
  .slide::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.4));
  }

  .slide-action {
    position: absolute;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.85rem 1.2rem;
    background: rgba(0, 0, 0, 0.48);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    color: #fff;
    font-size: 0.85rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .slide-action:hover {
    transform: translateX(-50%) translateY(-2px);
    background: rgba(0, 0, 0, 0.6);
  }

  .slide-action svg {
    width: 0.85rem;
    height: 0.85rem;
    fill: currentColor;
  }

  .scroll-indicator {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.55rem;
    color: rgba(255,255,255,0.8);
    font-size: 0.75rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  body:not(.opened) .scroll-indicator { opacity: 0; }
  .scroll-indicator::before {
    content: "";
    width: 1px;
    height: 42px;
    background: rgba(255,255,255,0.5);
    animation: pulse 1.8s infinite ease-in-out;
  }
  @keyframes pulse {
    0%,100% { opacity: 0.35; transform: scaleY(0.85); }
    50% { opacity: 1; transform: scaleY(1.05); }
  }

  @media (max-width: 720px) {
    .envelope-shell { width: min(320px, 88vw); }
    .envelope-inner h1 { font-size: clamp(1.7rem, 8vw, 3rem); }
    .envelope-inner button { padding: 0.9rem 1.6rem; }
  }
</style>
</head>
<body>
  <div class="envelope" id="envelope">
    <div class="envelope-shell">
      <div class="envelope-inner">
        <h1>Open the invitation</h1>
        <button id="openBtn" type="button">Lift the flap</button>
        <div class="envelope-hint">Tap the button to reveal the invitation</div>
      </div>
    </div>
  </div>

  <div class="gallery" id="gallery">
    <section class="slide" style="background-image: url('uploads/Sangeeth Night.svg');">
      <a class="slide-action" href="https://www.google.com/maps/search/?api=1&query=Krish+Garden+Farm+Resorts+Chidambaram" target="_blank" rel="noreferrer noopener">
        <span>Location</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C8.4 2.5 5.5 5.4 5.5 9c0 5.3 6 11.8 6.2 12.1.1.1.3.1.4 0 .2-.3 6.2-6.8 6.2-12.1 0-3.6-2.9-6.5-6.5-6.5zm0 9.1c-1.4 0-2.5-1.1-2.5-2.5S10.6 6.6 12 6.6s2.5 1.1 2.5 2.5S13.4 11.6 12 11.6z"/></svg>
      </a>
    </section>
    <section class="slide" style="background-image: url('uploads/Church invitation.svg');">
      <a class="slide-action" href="https://www.google.com/maps/search/?api=1&query=Sri+Krishna+Grand+Mahal+Chidambaram" target="_blank" rel="noreferrer noopener">
        <span>Location</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C8.4 2.5 5.5 5.4 5.5 9c0 5.3 6 11.8 6.2 12.1.1.1.3.1.4 0 .2-.3 6.2-6.8 6.2-12.1 0-3.6-2.9-6.5-6.5-6.5zm0 9.1c-1.4 0-2.5-1.1-2.5-2.5S10.6 6.6 12 6.6s2.5 1.1 2.5 2.5S13.4 11.6 12 11.6z"/></svg>
      </a>
    </section>
    <section class="slide" style="background-image: url('uploads/Reception .svg');">
      <a class="slide-action" href="https://www.google.com/maps/search/?api=1&query=Sri+Krishna+Grand+Mahal+Chidambaram" target="_blank" rel="noreferrer noopener">
        <span>Location</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C8.4 2.5 5.5 5.4 5.5 9c0 5.3 6 11.8 6.2 12.1.1.1.3.1.4 0 .2-.3 6.2-6.8 6.2-12.1 0-3.6-2.9-6.5-6.5-6.5zm0 9.1c-1.4 0-2.5-1.1-2.5-2.5S10.6 6.6 12 6.6s2.5 1.1 2.5 2.5S13.4 11.6 12 11.6z"/></svg>
      </a>
    </section>
    <section class="slide" style="background-image: url('uploads/Mugurtham .jpg');">
      <a class="slide-action" href="https://www.google.com/maps/search/?api=1&query=Sri+Krishna+Grand+Mahal+Chidambaram" target="_blank" rel="noreferrer noopener">
        <span>Location</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C8.4 2.5 5.5 5.4 5.5 9c0 5.3 6 11.8 6.2 12.1.1.1.3.1.4 0 .2-.3 6.2-6.8 6.2-12.1 0-3.6-2.9-6.5-6.5-6.5zm0 9.1c-1.4 0-2.5-1.1-2.5-2.5S10.6 6.6 12 6.6s2.5 1.1 2.5 2.5S13.4 11.6 12 11.6z"/></svg>
      </a>
    </section>
  </div>

  <div class="scroll-indicator">Scroll</div>

  <script>
    const body = document.body;
    const envelope = document.getElementById('envelope');
    const openBtn = document.getElementById('openBtn');

    openBtn.addEventListener('click', () => {
      envelope.classList.add('opened');
      envelope.classList.add('closed');
      body.classList.add('opened');
      setTimeout(() => envelope.remove(), 900);
    });
  </script>
</body>
</html>
