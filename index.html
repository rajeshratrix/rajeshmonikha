<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rajesh & Monikha</title>
<meta name="description" content="A portrait-style invitation filled with full-screen images." />
<style>
  :root {
    color-scheme: dark;
    color: #f4f0eb;
    background: #050505;
    accent: #c29963;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; }
  html { scroll-behavior: smooth; }
  body {
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #050505;
    color: #f4f0eb;
    overflow-x: hidden;
    overflow-y: hidden;
  }
  body.opened { overflow-y: auto; }

  .envelope {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, rgba(248, 232, 209, 0.08), transparent 48%), #050505;
    transition: opacity 0.8s ease 0.3s;
  }
  .envelope.opened { opacity: 0; pointer-events: none; }

  .envelope-frame {
    position: relative;
    width: min(460px, 88vw);
    aspect-ratio: 8 / 11;
    background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 32px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  .envelope-frame::before,
  .envelope-frame::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 70%);
    pointer-events: none;
  }
  .envelope-frame::before { top: 0; transform: skewY(4deg); }
  .envelope-frame::after { bottom: 0; transform: skewY(-4deg); }

  .envelope-card {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 42px 30px;
    text-align: center;
  }
  .envelope-card h1 {
    margin: 0;
    font-size: clamp(2rem, 4vw, 4.4rem);
    letter-spacing: 0.08em;
    line-height: 1.02;
    text-transform: uppercase;
  }
  .envelope-card p {
    margin: 16px auto 0;
    max-width: 21rem;
    font-size: 0.95rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(244,240,235,0.72);
  }
  .open-btn {
    margin-top: 36px;
    padding: 18px 30px;
    border: 1px solid rgba(244,240,235,0.22);
    background: rgba(141, 105, 63, 0.14);
    color: #f4f0eb;
    font-size: 0.95rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 999px;
    transition: transform 0.25s ease, background 0.25s ease;
  }
  .open-btn:hover { transform: translateY(-2px); background: rgba(141, 105, 63, 0.24); }

  .gallery {
    position: relative;
    z-index: 1;
    display: grid;
    scroll-snap-type: y mandatory;
    overflow-x: hidden;
    overflow-y: auto;
    height: 100vh;
  }
  .slide {
    min-height: 100vh;
    scroll-snap-align: start;
    position: relative;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: grid;
    place-items: end center;
  }
  .slide::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(5,5,5,0.04), rgba(5,5,5,0.55));
  }
  .slide-content {
    position: relative;
    width: min(740px, 88vw);
    padding: 2rem 1.5rem 3rem;
    text-align: center;
    color: #f4f0eb;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .slide.in-view .slide-content { opacity: 1; transform: translateY(0); }
  .slide-caption {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.85rem 1.2rem;
    border: 1px solid rgba(244,240,235,0.2);
    border-radius: 999px;
    background: rgba(0,0,0,0.28);
    backdrop-filter: blur(6px);
    font-size: 0.9rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .slide-caption span { display: inline-block; width: 0.6rem; height: 0.6rem; background: rgba(194,153,99,0.9); border-radius: 50%; }

  .scroll-cue {
    position: fixed;
    right: 20px;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 15;
    color: rgba(244,240,235,0.85);
    font-size: 0.8rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  body.opened .scroll-cue { opacity: 1; }
  .scroll-line {
    width: 1px;
    height: 50px;
    background: rgba(244,240,235,0.35);
    animation: pulse 1.8s infinite ease-in-out;
  }
  @keyframes pulse {
    0%,100% { opacity: 0.3; transform: scaleY(0.85); }
    50% { opacity: 1; transform: scaleY(1.05); }
  }

  @media (max-width: 720px) {
    .envelope-frame { aspect-ratio: 4 / 5; }
    .envelope-card h1 { font-size: clamp(2rem, 8vw, 3rem); }
    .slide-content { padding: 1.5rem 1rem 2.5rem; }
  }
</style>
</head>
<body class="gated">
<div class="envelope" id="envelope">
  <div class="envelope-frame">
    <div class="envelope-card">
      <h1>Rajesh &amp; Monikha</h1>
      <p>An intimate portrait invitation<br>in full-screen images.</p>
      <button class="open-btn" id="openBtn">Open the invitation</button>
    </div>
  </div>
</div>
<div class="gallery" id="gallery">
  <section class="slide" style="background-image: url('images/g1.jpg');">
    <div class="slide-content">
      <div class="slide-caption"><span></span>Portrait 1</div>
    </div>
  </section>
  <section class="slide" style="background-image: url('images/g2.jpg');">
    <div class="slide-content">
      <div class="slide-caption"><span></span>Portrait 2</div>
    </div>
  </section>
  <section class="slide" style="background-image: url('images/g3.jpg');">
    <div class="slide-content">
      <div class="slide-caption"><span></span>Portrait 3</div>
    </div>
  </section>
  <section class="slide" style="background-image: url('images/g4.jpg');">
    <div class="slide-content">
      <div class="slide-caption"><span></span>Portrait 4</div>
    </div>
  </section>
  <section class="slide" style="background-image: url('images/g5.jpg');">
    <div class="slide-content">
      <div class="slide-caption"><span></span>Portrait 5</div>
    </div>
  </section>
  <section class="slide" style="background-image: url('images/story-photo.jpg');">
    <div class="slide-content">
      <div class="slide-caption"><span></span>Story photo</div>
    </div>
  </section>
</div>
<div class="scroll-cue">
  <div class="scroll-line"></div>
  Scroll
</div>
<script>
  const body = document.body;
  const envelope = document.getElementById('envelope');
  const openBtn = document.getElementById('openBtn');
  const slides = document.querySelectorAll('.slide');

  function openInvitation() {
    body.classList.add('opened');
    envelope.classList.add('opened');
    setTimeout(() => envelope.remove(), 900);
  }

  if (openBtn) {
    openBtn.addEventListener('click', openInvitation);
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.3 });

  slides.forEach(slide => observer.observe(slide));
</script>
</body>
</html>
