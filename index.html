<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rajesh & Monikha</title>
<meta name="description" content="A portrait-style invitation with full-screen images." />
<style>
  :root {
    color-scheme: light;
    --background: #ebe2d6;
    --surface: rgba(255,255,255,0.86);
    --surface-strong: rgba(255,255,255,0.96);
    --text: #3e2f20;
    --muted: rgba(62,47,32,0.72);
    --accent: #b47f4b;
    --shadow: rgba(39,27,18,0.12);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; overflow: hidden; }
  body.opened { overflow-y: auto; }
  body { font-family: system-ui, sans-serif; background: var(--background); color: var(--text); }

  .scene-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    filter: blur(44px) saturate(1.2) brightness(1.05);
    transform: scale(1.08);
    opacity: 0.92;
    transition: background-image 0.6s ease, opacity 0.4s ease;
  }
    position: fixed;
    inset: 0;
    z-index: -1;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    filter: blur(32px) saturate(1.4);
    transform: scale(1.08);
    opacity: 0.78;
    transition: background-image 0.6s ease, opacity 0.4s ease;
  }
  .scene-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top center, rgba(255,255,255,0.84), transparent 30%), linear-gradient(180deg, rgba(255,255,255,0.6), rgba(235,226,214,0.85));
  }

  body.opened .scene-bg {
    opacity: 0.68;
  }

  .envelope {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, rgba(255,255,255,0.92), transparent 45%), var(--background);
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  .envelope.closed { opacity: 0; visibility: hidden; pointer-events: none; }

  .envelope-shell {
    width: min(420px, 88vw);
    aspect-ratio: 9 / 11;
    position: relative;
    border-radius: 38px;
    background: linear-gradient(180deg, rgba(255,255,255,0.94), rgba(249,241,229,0.96));
    border: 1px solid rgba(181,144,103,0.22);
    box-shadow: 0 28px 60px var(--shadow);
    overflow: hidden;
  }
    width: min(420px, 88vw);
    aspect-ratio: 9 / 11;
    position: relative;
    border-radius: 32px;
    background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 32px 90px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  .envelope-shell::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 35% 18%, rgba(255,255,255,0.76), transparent 30%), linear-gradient(135deg, rgba(255,255,255,0.42), transparent 28%);
    pointer-events: none;
  }

  .envelope-shell::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 58%;
    background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.04));
    clip-path: polygon(0 0, 100% 0, 50% 74%);
    transform-origin: top center;
    transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 1;
  }

  .envelope.opened .envelope-shell::after {
    transform: translateY(-102%) rotateX(-90deg);
  }

  .envelope-inner {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 2rem;
    text-align: center;
    z-index: 2;
  }
  .envelope-inner h1 {
    margin: 0;
    font-size: clamp(2.2rem, 6vw, 4rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text);
  }
  .envelope-inner button {
    margin-top: 1.8rem;
    padding: 1rem 2.4rem;
    border: 1px solid rgba(180,116,68,0.28);
    background: rgba(180,116,68,0.14);
    color: var(--accent);
    font-size: 0.95rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 20px 40px rgba(190,149,103,0.18);
    transition: transform 0.25s ease, background 0.25s ease;
  }
  .envelope-inner button:hover { transform: translateY(-2px); background: rgba(180,116,68,0.22); }

  .envelope-hint {
    margin-top: 1rem;
    font-size: 0.9rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
    margin-top: 1rem;
    font-size: 0.85rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.75);
  }

  .gallery {
    width: 100vw;
    min-height: 100vh;
    display: grid;
    scroll-snap-type: y mandatory;
    overflow-x: hidden;
    overflow-y: auto;
  }
  .slide {
    position: relative;
    min-height: 100vh;
    width: 100%;
    scroll-snap-align: start;
    background-size: contain;
    background-position: center center;
    background-repeat: no-repeat;
    background-color: rgba(255,255,255,0.7);
  }
  .slide::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.4));
  }

  .slide-action {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.6rem;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(212,184,147,0.4);
    border-radius: 999px;
    color: var(--text);
    font-size: 0.95rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 24px 54px rgba(77,54,39,0.1);
    backdrop-filter: blur(12px);
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .slide-action:hover {
    transform: translateX(-50%) translateY(-2px);
    background: rgba(255,255,255,0.78);
    box-shadow: 0 24px 54px rgba(77,54,39,0.18);
  }
    z-index: 2;
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 1.6rem;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.24);
    border-radius: 999px;
    color: #fff;
    font-size: 0.95rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-decoration: none;
    box-shadow: 0 20px 45px rgba(0,0,0,0.2);
    backdrop-filter: blur(14px);
    transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .slide-action:hover {
    transform: translateX(-50%) translateY(-2px);
    background: rgba(255,255,255,0.22);
    box-shadow: 0 24px 54px rgba(0,0,0,0.24);
  }

  .slide-action svg {
    width: 0.85rem;
    height: 0.85rem;
    fill: currentColor;
  }

  .scroll-indicator {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.55rem;
    color: rgba(255,255,255,0.8);
    font-size: 0.75rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  body:not(.opened) .scroll-indicator { opacity: 0; }
  .scroll-indicator::before {
    content: "";
    width: 1px;
    height: 42px;
    background: rgba(255,255,255,0.5);
    animation: pulse 1.8s infinite ease-in-out;
  }
  @keyframes pulse {
    0%,100% { opacity: 0.35; transform: scaleY(0.85); }
    50% { opacity: 1; transform: scaleY(1.05); }
  }

  @media (max-width: 720px) {
    .envelope-shell { width: min(320px, 88vw); }
    .envelope-inner h1 { font-size: clamp(1.7rem, 8vw, 3rem); }
    .envelope-inner button { padding: 0.9rem 1.6rem; }
    .slide-action { bottom: 18px; padding: 0.9rem 1.4rem; font-size: 0.85rem; }
  }
</style>
</head>
<body>
  <div class="scene-bg" id="sceneBg"></div>
  <div class="envelope" id="envelope">
    <div class="envelope-shell">
      <div class="envelope-inner">
        <h1>Begin the celebration</h1>
        <button id="openBtn" type="button">Unfold the moments</button>
        <div class="envelope-hint">Tap to unveil every ceremony card</div>
      </div>
    </div>
  </div>

  <div class="gallery" id="gallery">
    <section class="slide" data-bg="uploads/Sangeeth Night.svg" style="background-image: url('uploads/Sangeeth Night.svg');">
      <a class="slide-action" href="https://www.google.com/maps/search/?api=1&query=Krish+Garden+Farm+Resorts+Chidambaram" target="_blank" rel="noreferrer noopener">
        <span>View venue</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C8.4 2.5 5.5 5.4 5.5 9c0 5.3 6 11.8 6.2 12.1.1.1.3.1.4 0 .2-.3 6.2-6.8 6.2-12.1 0-3.6-2.9-6.5-6.5-6.5zm0 9.1c-1.4 0-2.5-1.1-2.5-2.5S10.6 6.6 12 6.6s2.5 1.1 2.5 2.5S13.4 11.6 12 11.6z"/></svg>
      </a>
    </section>
    <section class="slide" data-bg="uploads/Church invitation.svg" style="background-image: url('uploads/Church invitation.svg');">
      <a class="slide-action" href="https://www.google.com/maps/search/?api=1&query=Sri+Krishna+Grand+Mahal+Chidambaram" target="_blank" rel="noreferrer noopener">
        <span>View venue</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C8.4 2.5 5.5 5.4 5.5 9c0 5.3 6 11.8 6.2 12.1.1.1.3.1.4 0 .2-.3 6.2-6.8 6.2-12.1 0-3.6-2.9-6.5-6.5-6.5zm0 9.1c-1.4 0-2.5-1.1-2.5-2.5S10.6 6.6 12 6.6s2.5 1.1 2.5 2.5S13.4 11.6 12 11.6z"/></svg>
      </a>
    </section>
    <section class="slide" data-bg="uploads/Reception .svg" style="background-image: url('uploads/Reception .svg');">
      <a class="slide-action" href="https://www.google.com/maps/search/?api=1&query=Sri+Krishna+Grand+Mahal+Chidambaram" target="_blank" rel="noreferrer noopener">
        <span>View venue</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C8.4 2.5 5.5 5.4 5.5 9c0 5.3 6 11.8 6.2 12.1.1.1.3.1.4 0 .2-.3 6.2-6.8 6.2-12.1 0-3.6-2.9-6.5-6.5-6.5zm0 9.1c-1.4 0-2.5-1.1-2.5-2.5S10.6 6.6 12 6.6s2.5 1.1 2.5 2.5S13.4 11.6 12 11.6z"/></svg>
      </a>
    </section>
    <section class="slide" data-bg="uploads/Mugurtham .jpg" style="background-image: url('uploads/Mugurtham .jpg');">
      <a class="slide-action" href="https://www.google.com/maps/search/?api=1&query=Sri+Krishna+Grand+Mahal+Chidambaram" target="_blank" rel="noreferrer noopener">
        <span>View venue</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C8.4 2.5 5.5 5.4 5.5 9c0 5.3 6 11.8 6.2 12.1.1.1.3.1.4 0 .2-.3 6.2-6.8 6.2-12.1 0-3.6-2.9-6.5-6.5-6.5zm0 9.1c-1.4 0-2.5-1.1-2.5-2.5S10.6 6.6 12 6.6s2.5 1.1 2.5 2.5S13.4 11.6 12 11.6z"/></svg>
      </a>
    </section>
  </div>

  <div class="scroll-indicator">Scroll</div>

  <script>
    const body = document.body;
    const envelope = document.getElementById('envelope');
    const openBtn = document.getElementById('openBtn');
    const sceneBg = document.getElementById('sceneBg');
    const slides = document.querySelectorAll('.slide');

    const setSceneBg = (url) => {
      sceneBg.style.backgroundImage = url ? `url('${url}')` : 'none';
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const bgUrl = entry.target.dataset.bg;
          setSceneBg(bgUrl);
        }
      });
    }, { threshold: 0.55 });

    slides.forEach(slide => observer.observe(slide));
    setSceneBg(slides[0]?.dataset.bg);

    openBtn.addEventListener('click', () => {
      envelope.classList.add('opened');
      envelope.classList.add('closed');
      body.classList.add('opened');
      setTimeout(() => envelope.remove(), 900);
      setSceneBg(slides[0]?.dataset.bg);
    });
  </script>
</body>
</html>
