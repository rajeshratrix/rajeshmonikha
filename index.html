<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Rajesh & Monikha</title>
<meta name="description" content="A portrait-style invitation with full-screen images." />
<style>
  :root {
    color-scheme: dark;
    color: #fff;
    background: #050505;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body.opened { overflow-y: auto; }
  body { font-family: system-ui, sans-serif; background: #050505; }

  .envelope {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at top, rgba(255,255,255,0.08), transparent 45%), #050505;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  .envelope.closed { opacity: 0; visibility: hidden; pointer-events: none; }

  .envelope-shell {
    width: min(420px, 88vw);
    aspect-ratio: 9 / 11;
    position: relative;
    border-radius: 32px;
    background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 32px 90px rgba(0, 0, 0, 0.5);
    overflow: hidden;
  }

  .envelope-shell::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), transparent 20%);
    pointer-events: none;
  }

  .envelope-inner {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 2rem;
    text-align: center;
  }
  .envelope-inner h1 {
    margin: 0;
    font-size: clamp(2rem, 6vw, 4rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .envelope-inner button {
    margin-top: 2.5rem;
    padding: 1rem 2rem;
    border: 1px solid rgba(255,255,255,0.24);
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 0.95rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.25s ease, background 0.25s ease;
  }
  .envelope-inner button:hover { transform: translateY(-2px); background: rgba(255,255,255,0.14); }

  .gallery {
    width: 100vw;
    min-height: 100vh;
    display: grid;
    scroll-snap-type: y mandatory;
    overflow-x: hidden;
    overflow-y: auto;
  }
  .slide {
    position: relative;
    min-height: 100vh;
    width: 100%;
    scroll-snap-align: start;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .slide::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.08), rgba(0,0,0,0.4));
  }

  .scroll-indicator {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.55rem;
    color: rgba(255,255,255,0.8);
    font-size: 0.75rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    opacity: 1;
    transition: opacity 0.3s ease;
  }
  body:not(.opened) .scroll-indicator { opacity: 0; }
  .scroll-indicator::before {
    content: "";
    width: 1px;
    height: 42px;
    background: rgba(255,255,255,0.5);
    animation: pulse 1.8s infinite ease-in-out;
  }
  @keyframes pulse {
    0%,100% { opacity: 0.35; transform: scaleY(0.85); }
    50% { opacity: 1; transform: scaleY(1.05); }
  }

  @media (max-width: 720px) {
    .envelope-shell { width: min(320px, 88vw); }
    .envelope-inner h1 { font-size: clamp(1.7rem, 8vw, 3rem); }
    .envelope-inner button { padding: 0.9rem 1.6rem; }
  }
</style>
</head>
<body>
  <div class="envelope" id="envelope">
    <div class="envelope-shell">
      <div class="envelope-inner">
        <h1>Open Invitation</h1>
        <button id="openBtn" type="button">Open the envelope</button>
      </div>
    </div>
  </div>

  <div class="gallery" id="gallery">
    <section class="slide" style="background-image: url('images/g1.jpg');"></section>
    <section class="slide" style="background-image: url('images/g2.jpg');"></section>
    <section class="slide" style="background-image: url('images/g3.jpg');"></section>
    <section class="slide" style="background-image: url('images/g4.jpg');"></section>
    <section class="slide" style="background-image: url('images/g5.jpg');"></section>
    <section class="slide" style="background-image: url('images/story-photo.jpg');"></section>
  </div>

  <div class="scroll-indicator">Scroll</div>

  <script>
    const body = document.body;
    const envelope = document.getElementById('envelope');
    const openBtn = document.getElementById('openBtn');

    openBtn.addEventListener('click', () => {
      envelope.classList.add('closed');
      body.classList.add('opened');
      setTimeout(() => envelope.remove(), 700);
    });
  </script>
</body>
</html>
